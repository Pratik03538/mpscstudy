[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:miniapp]
directory=/app/telegram_bot/miniapp
command=/bin/sh -c "exec uvicorn server:app --host 0.0.0.0 --port ${PORT:-8000}"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:telegram-bot]
directory=/app/telegram_bot/bot
command=/bin/sh /app/telegram_bot/deploy/start-bot.sh
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
